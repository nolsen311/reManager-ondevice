# Tests and builds the on-tablet app. The desktop app this repo was forked
# from is not built here.
name: Check

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      PACKAGES: ./internal/executor ./internal/appload ./internal/ondevice ./internal/vellum ./internal/installer ./cmd/remanager-ondevice
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Qt tools for the screens
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev-tools qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtqml qml-qt6

      - name: Format
        run: |
          unformatted=$(gofmt -l internal/executor internal/appload internal/ondevice cmd/remanager-ondevice)
          if [ -n "$unformatted" ]; then echo "Run gofmt on: $unformatted"; exit 1; fi

      - name: Vet
        run: go vet $PACKAGES

      - name: Test
        run: go test -race -count=1 $PACKAGES

      - name: Build the app folder for the tablet
        run: VERSION="check-${GITHUB_SHA::7}" RCC=/usr/lib/qt6/libexec/rcc ondevice/build.sh

      - name: Render the screens with a mock backend
        run: |
          out="$RUNNER_TEMP/screens"
          ondevice/test/render.sh "$out" 2>&1 | tee "$RUNNER_TEMP/render.log"
          # The renderer carries on past QML errors, so they are looked for in its output.
          if grep -E "TypeError|ReferenceError|Unable to assign|is not a type|is not defined|Cannot read" "$RUNNER_TEMP/render.log"; then
            echo "QML errors while rendering"; exit 1
          fi
          count=$(ls "$out"/*.png | wc -l)
          echo "$count screens rendered"
          [ "$count" -ge 20 ]

      - uses: actions/upload-artifact@v6
        with:
          name: screens
          path: ${{ runner.temp }}/screens
